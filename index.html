<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Finance SaaS</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <h1>💰 Finance SaaS</h1>
  <p>Gestão Financeira Inteligente • Regra 50/30/20</p>
</header>

<main class="container">

  <section class="card">
    <h2>📅 Período</h2>
    <input type="month" id="periodo">
  </section>

  <section class="grid">

    <div class="card">
      <h2>Entradas</h2>
      <input id="capitalDesc" placeholder="Salário / Extra">
      <input id="capitalVal" placeholder="Valor">
      <button onclick="addCapital()">Adicionar</button>
      <ul id="capitalList"></ul>
    </div>

    <div class="card">
      <h2>Dívidas</h2>
      <input id="dividaNome" placeholder="Cartão / Empréstimo">
      <input id="dividaTotal" placeholder="Valor total">
      <input id="dividaParcelas" type="number" placeholder="Parcelas">
      <button onclick="addDivida()">Adicionar</button>
      <ul id="dividaList"></ul>
    </div>

    <div class="card">
      <h2>Gastos</h2>
      <input id="gastoDesc" placeholder="Uber, Almoço...">
      <input id="gastoVal" placeholder="Valor">
      <select id="gastoCat">
        <option value="necessidades">Necessidades</option>
        <option value="desejos">Desejos</option>
      </select>
      <button onclick="addGasto()">Adicionar</button>
      <ul id="gastoList"></ul>
    </div>

  </section>

  <section class="card resumo">
    <h2>Resumo</h2>
    <p>Entradas: <strong id="totalCapital"></strong></p>
    <p>Dívidas Mensais: <strong id="totalDividas"></strong></p>
    <p>Gastos: <strong id="totalGastos"></strong></p>
    <h3>Saldo: <span id="saldo"></span></h3>
    <div id="alerta" class="alerta"></div>
    <button onclick="exportPDF()">📄 Exportar Relatório em PDF</button>
  </section>

  <section class="card">
    <h2>Regra 50/30/20</h2>
    <canvas id="chart"></canvas>
  </section>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
